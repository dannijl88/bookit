spring.application.name=bookit

# Conexión a PostgreSQL. En Neon, SPRING_DATASOURCE_URL debe incluir ?sslmode=require.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Pool pequeño: el plan gratuito de Neon limita el número de conexiones.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# update crea/actualiza el esquema en el primer despliegue de la demo.
# Cuando existan migraciones reales, usar validate.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=10

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=8080

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true