spring.application.name=bookit

# Conexión a PostgreSQL. En Neon, SPRING_DATASOURCE_URL debe incluir ?sslmode=require.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bookit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Pool pequeño: el plan gratuito de Neon limita el número de conexiones.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Flyway es ahora el dueño del esquema (migraciones en classpath:db/migration).
# Hibernate solo valida que las entidades coincidan con el esquema migrado.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=10

# Flyway gestiona el esquema. En la base de la demo las tablas ya existen y no
# hay historial de Flyway: con baseline-on-migrate=true y baseline-version=1,
# Flyway marca la V1 como aplicada sin ejecutarla y solo aplica migraciones nuevas.
# En una base vacía (tests, entornos nuevos) Flyway ejecuta V1 desde cero.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Datos de demostración idempotentes (DEMO_SEED=true los carga al arrancar).
app.demo-seed=${DEMO_SEED:false}

# Render inyecta el puerto por la variable PORT; en local se usa 8080.
server.port=${PORT:8080}

# Actuator: sólo /actuator/health es público (lo usan los health checks de Render).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# El correo es opcional: no debe marcar la app como DOWN si no hay credenciales SMTP.
management.health.mail.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Remitente de los correos. Debe ser una dirección permitida por tu proveedor
# SMTP (normalmente el usuario autenticado o un dominio verificado).
app.mail.from=${MAIL_FROM:noreply@bookit.com}