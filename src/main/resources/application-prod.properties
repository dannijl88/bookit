# Perfil de producción (Render). Activar con SPRING_PROFILES_ACTIVE=prod.
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Lazy initialization: los beans se crean en su primer uso en vez de al arrancar.
#   Pros: arranque en frío bastante más rápido y menos memoria al inicio
#         (importante en el plan free de Render: 512 MB / 0.1 CPU).
#   Contras: los errores de configuración se manifiestan en la primera petición
#            y no en el arranque; la primera llamada a cada endpoint es más lenta.
spring.main.lazy-initialization=true

# Logging sobrio: INFO de la app, SQL de Hibernate y ruido de framework silenciados.
logging.level.root=INFO
logging.level.com.dani.bookit=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
