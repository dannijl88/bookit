# Levanta el stack completo: MySQL + backend (Spring Boot) + frontend (Nginx).
#
#   1. cp .env.example .env   (y ajusta DB_PASSWORD / JWT_SECRET)
#   2. docker compose up --build
#   3. Frontend en http://localhost:5173 · API en http://localhost:8080
#
# Todos los secretos se leen de `.env` (ver .env.example); nada se hardcodea aquí.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
      MYSQL_DATABASE: bookit
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Sin puerto publicado: sólo accesible desde la red interna de Compose.

  backend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Sobrescriben application.properties vía relaxed binding de Spring Boot.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bookit
      SPRING_DATASOURCE_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./slotlyfy-frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql-data:
