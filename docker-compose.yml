# Levanta el stack completo: PostgreSQL + backend (Spring Boot) + frontend (Nginx).
#
#   1. cp .env.example .env   (y ajusta DB_PASSWORD / JWT_SECRET)
#   2. docker compose up --build
#   3. Frontend en http://localhost:5173 · API en http://localhost:8080
#
# Todos los secretos se leen de `.env` (ver .env.example); nada se hardcodea aquí.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookit
      POSTGRES_USER: bookit
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookit -d bookit"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Sin puerto publicado: sólo accesible desde la red interna de Compose.

  backend:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Sobrescriben application.properties vía relaxed binding de Spring Boot.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookit
      SPRING_DATASOURCE_USERNAME: bookit
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./slotlyfy-frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres-data:
