server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA con React Router en modo declarativo: cualquier ruta desconocida
    # (p. ej. /panel/servicios) debe servir index.html y no un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets generados por Vite llevan hash en el nombre: cacheables a largo plazo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
